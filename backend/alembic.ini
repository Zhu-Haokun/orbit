# Alembic configuration (spec §6.2 / §62).
#
# NOTE: keep this file ASCII-only. configparser reads it with the platform
# locale encoding (GBK on zh-CN Windows), so non-ASCII comments here make
# `alembic upgrade head` fail with UnicodeDecodeError.
#
# The database URL is not set here: alembic/env.py reads DATABASE_URL through
# app.core.config, so there is exactly one place to switch to PostgreSQL.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Revision files carry a time prefix so they read in order.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Emit SQL while migrating (also applies to --sql mode).
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
