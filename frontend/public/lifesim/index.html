<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="人生概率实验室 LifeSim —— 用蒙特卡洛方法探索人生的概率结构。纯前端、零依赖、完全离线。">
<title>人生概率实验室 · LifeSim</title>

<!-- ============================================================
     样式加载顺序：令牌 → 基础 → 组件 → 页面
     规格书 §5.2 要求颜色/间距/字号只能来自 tokens.css，
     所以 tokens.css 必须最先加载，且不允许其它文件定义字面色值以外的语义色。
     ============================================================ -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>

<!-- 背景层：径向光晕 + 网格，纯 CSS，不占用任何脚本 -->
<div class="bg-layer" aria-hidden="true"></div>

<!-- 应用挂载点：shell.js 会把整个界面构建进这里 -->
<div id="root"></div>

<!-- Toast 宿主（components.js 也会在缺失时自动创建） -->
<div class="toast-host" id="toast-host"></div>

<!-- ============================================================
     脚本加载顺序（经典 script，不用 type="module"）
     这样双击 index.html 从 file:// 打开也能完整运行 —— ES 模块会被
     浏览器的 CORS 策略拦下，所以整个项目刻意使用 IIFE + 全局命名空间。

     依赖顺序：
       1. core   —— 无依赖
       2. sim    —— 依赖 core
       3. ui     —— 依赖 sim（store/knowledge 会读 config）
       4. charts —— 依赖 core 的 stats 与 ui 的 store
       5. views  —— 依赖以上全部
       6. main   —— 最后启动
     ============================================================ -->

<!-- 1. 核心 -->
<script src="js/core/util.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/core/distributions.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/markov.js"></script>

<!-- 2. 模拟引擎 -->
<script src="js/sim/config.js"></script>
<script src="js/sim/character.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/events.js"></script>
<script src="js/sim/life.js"></script>
<script src="js/sim/montecarlo.js"></script>

<!-- 3. UI 基础设施 -->
<script src="js/ui/dom.js"></script>
<script src="js/ui/store.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/knowledge.js"></script>
<script src="js/ui/meta.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/shell.js"></script>

<!-- 4. 图表引擎 -->
<script src="js/charts/base.js"></script>
<script src="js/charts/basic.js"></script>
<script src="js/charts/life.js"></script>
<script src="js/charts/analysis.js"></script>
<script src="js/charts/particles.js"></script>

<!-- 5. 页面 -->
<script src="js/views/common.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/create.js"></script>
<script src="js/views/run.js"></script>
<script src="js/views/result.js"></script>
<script src="js/views/universe.js"></script>
<script src="js/views/compare.js"></script>
<script src="js/views/lab.js"></script>
<script src="js/views/archive.js"></script>
<script src="js/views/codex.js"></script>
<script src="js/views/settings.js"></script>

<!-- 6. 启动 -->
<script src="js/main.js"></script>
</body>
</html>
