  <g transform="rotate(-24 104 96)">
    <ellipse cx="104" cy="96" rx="18" ry="12" fill="rgba(139,140,255,0.14)" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
