  <path d="M 404 232 C 422 224 438 224 456 232" fill="none" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 404 258 C 422 250 438 250 456 258" fill="none" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 484 206 C 502 198 518 198 536 206" fill="none" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 484 232 C 502 224 518 224 536 232" fill="none" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 484 258 C 502 250 518 250 536 258" fill="none" stroke="rgba(139,140,255,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
